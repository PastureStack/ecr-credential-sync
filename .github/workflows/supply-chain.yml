name: PastureStack / Build, test, and supply-chain evidence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecr-credential-sync-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reproducible build, test, SBOM, and Trivy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DAPPER_IMAGE: local/ecr-credential-sync-dapper:${{ github.sha }}
      DAPPER_BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      VERSION_OVERRIDE: v3.1.0
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned host Buildx without external actions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source toolchain/host-build-toolchain.lock
          test "$HOST_BUILDX_INSTALL_METHOD" = repository-locked-offline-source-builder
          test "$HOST_BUILDX_INSTALLER_PATH" = scripts/install-locked-host-buildx
          test "$HOST_BUILDX_PLUGIN_RELATIVE_PATH" = cli-plugins/docker-buildx
          for required_command in chmod cp find grep id mkdir realpath sha256sum stat; do
            command -v "$required_command" >/dev/null
          done
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ]]
          [[ "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]
          [[ "${GITHUB_JOB:-}" =~ ^[A-Za-z0-9_-]+$ ]]
          test -n "${HOME:-}"
          canonical_home="$(realpath -e -- "$HOME")"
          test -d "$canonical_home"
          test ! -L "$canonical_home"
          test -O "$canonical_home"
          test -z "$(find "$canonical_home" -maxdepth 0 -perm /022 -print -quit)"

          caller_uid="$(id -u)"
          caller_gid="$(id -g)"
          path_component="$canonical_home"
          while [ "$path_component" != / ]; do
            parent="${path_component%/*}"
            test -n "$parent" || parent=/
            parent_uid="$(stat -Lc '%u' -- "$parent")"
            case "$parent_uid" in
              0|"$caller_uid") ;;
              *) exit 1 ;;
            esac
            if find "$parent" -maxdepth 0 -perm /022 -print -quit | grep -q .; then
              find "$parent" -maxdepth 0 -perm -1000 -print -quit | grep -q .
            fi
            path_component="$parent"
          done

          run_identity="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          install_root="${canonical_home}/.pasturestack-ecr-buildx-install-${run_identity}"
          docker_config_root="${canonical_home}/.pasturestack-ecr-docker-config-${run_identity}"

          create_run_root() {
            local root="$1"
            test ! -e "$root"
            test ! -L "$root"
            mkdir -m 0700 -- "$root"
            test -d "$root"
            test ! -L "$root"
            test -O "$root"
            test "$(realpath -e -- "$root")" = "$root"
            test "$(stat -Lc '%u:%g:%a' -- "$root")" = "${caller_uid}:${caller_gid}:700"
          }

          create_run_root "$install_root"
          install_root_identity="$(stat -Lc '%d:%i:%u:%g:%a' -- "$install_root")"
          {
            printf 'ECR_SYNC_BUILDX_INSTALL_ROOT=%s\n' "$install_root"
            printf 'ECR_SYNC_BUILDX_INSTALL_ROOT_IDENTITY=%s\n' "$install_root_identity"
          } >> "$GITHUB_ENV"

          create_run_root "$docker_config_root"
          docker_config_root_identity="$(stat -Lc '%d:%i:%u:%g:%a' -- "$docker_config_root")"
          {
            printf 'ECR_SYNC_DOCKER_CONFIG_ROOT=%s\n' "$docker_config_root"
            printf 'ECR_SYNC_DOCKER_CONFIG_ROOT_IDENTITY=%s\n' "$docker_config_root_identity"
          } >> "$GITHUB_ENV"

          locked_buildx="$(bash "$HOST_BUILDX_INSTALLER_PATH" "$install_root")"
          test "$locked_buildx" = "${install_root}/bin/docker-buildx"
          test ! -L "$locked_buildx"
          test -O "$locked_buildx"
          test "$(stat -Lc '%a' -- "$locked_buildx")" = 555
          locked_buildx_sha="$(sha256sum -- "$locked_buildx")"
          locked_buildx_sha="${locked_buildx_sha%% *}"
          test "$locked_buildx_sha" = "$HOST_BUILDX_BINARY_SHA256"
          read -r buildx_module buildx_version buildx_commit buildx_extra \
            <<<"$("$locked_buildx" version)"
          test "$buildx_module" = github.com/docker/buildx
          test "$buildx_version" = "$HOST_BUILDX_VERSION"
          test "$buildx_commit" = "$HOST_BUILDX_COMMIT"
          test -z "${buildx_extra:-}"
          test -f "${install_root}/buildx-go-version.txt"
          test ! -L "${install_root}/buildx-go-version.txt"
          test "$(stat -Lc '%a' -- "${install_root}/buildx-go-version.txt")" = 444
          bash scripts/check-buildx-module-versions \
            "${install_root}/buildx-go-version.txt" \
            "go${HOST_BUILDX_GO_VERSION}" \
            "$HOST_BUILDX_GO_ARCHIVE_VERSION" \
            "$HOST_BUILDX_X_MOD_VERSION"
          test -f "${install_root}/buildx-build.tsv"
          test ! -L "${install_root}/buildx-build.tsv"
          test "$(stat -Lc '%a' -- "${install_root}/buildx-build.tsv")" = 444
          test "$(grep -Fc $'binary\tbuildx-first\t'"${HOST_BUILDX_VERSION}"$'\t'"${HOST_BUILDX_BINARY_SHA256}" \
            "${install_root}/buildx-build.tsv")" -eq 1
          test "$(grep -Fc $'binary\tbuildx-second\t'"${HOST_BUILDX_VERSION}"$'\t'"${HOST_BUILDX_BINARY_SHA256}" \
            "${install_root}/buildx-build.tsv")" -eq 1

          cli_plugins="${docker_config_root}/cli-plugins"
          docker_buildx_plugin="${docker_config_root}/${HOST_BUILDX_PLUGIN_RELATIVE_PATH}"
          mkdir -m 0700 -- "$cli_plugins"
          test ! -e "$docker_buildx_plugin"
          test ! -L "$docker_buildx_plugin"
          cp -- "$locked_buildx" "$docker_buildx_plugin"
          chmod 0555 "$docker_buildx_plugin"
          test ! -L "$docker_buildx_plugin"
          test -O "$docker_buildx_plugin"
          test "$(stat -Lc '%a' -- "$docker_buildx_plugin")" = 555
          plugin_sha="$(sha256sum -- "$docker_buildx_plugin")"
          plugin_sha="${plugin_sha%% *}"
          test "$plugin_sha" = "$HOST_BUILDX_BINARY_SHA256"
          test "$(stat -Lc '%d:%i:%u:%g:%a' -- "$install_root")" = "$install_root_identity"
          test "$(stat -Lc '%d:%i:%u:%g:%a' -- "$docker_config_root")" = "$docker_config_root_identity"

          export DOCKER_CONFIG="$docker_config_root"
          export DAPPER_BUILDX_COMMAND="$locked_buildx"
          test "$(docker buildx version)" = \
            "github.com/docker/buildx ${HOST_BUILDX_VERSION} ${HOST_BUILDX_COMMIT}"
          {
            printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG"
            printf 'DAPPER_BUILDX_COMMAND=%s\n' "$DAPPER_BUILDX_COMMAND"
          } >> "$GITHUB_ENV"

      - name: Record immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-revision.txt
          sha256sum \
            .gitattributes \
            .dockerignore \
            README.md \
            SECURITY.md \
            ubuntu-apt.lock \
            Dockerfile.dapper \
            Makefile \
            package/Dockerfile \
            package/windows/amd64/Dockerfile \
            toolchain/buildx-security.patch \
            toolchain/host-build-toolchain.lock \
            scripts/build \
            scripts/build-runtime-image \
            scripts/check-buildx-module-versions \
            scripts/check-go-telemetry-state \
            scripts/cleanup-exact-trivy-cache \
            scripts/ci \
            scripts/entry \
            scripts/install-locked-host-buildx \
            scripts/package \
            scripts/normalize-runtime-context-mtimes \
            scripts/parse-buildx-buildkit-version \
            scripts/resolve-dapper-image-identity \
            scripts/check-source-gates \
            scripts/generate-source-sbom.py \
            scripts/test \
            scripts/test-buildx-buildkit-version \
            scripts/test-buildx-module-versions \
            scripts/test-cleanup-exact-trivy-cache \
            scripts/test-dapper-image-identity \
            scripts/test-go-telemetry-state \
            scripts/test-install-locked-host-buildx \
            scripts/test-runtime-image-export-load \
            scripts/validate \
            go.mod \
            go.sum \
            vendor/modules.txt \
            .github/workflows/supply-chain.yml \
            > evidence/source-inputs.sha256
          source toolchain/host-build-toolchain.lock
          test "$HOST_BUILDX_VERSION" = v0.36.1
          test "$HOST_BUILDX_COMMIT" = 1d8dde89b8aba914e05e45366770736fea1fd690
          test "$HOST_BUILDX_SOURCE_SHA256" = fb28b5c2a198d05482f0656dfb7ee161240a904e36697bf7108e5d517f23854b
          test "$HOST_BUILDX_SECURITY_PATCH_SHA256" = a29fdda204d592d0d46ed32b5fdc4336a7b3a7276301836d0a75b9386ca780f7
          test "$HOST_BUILDX_GO_VERSION" = 1.27.0
          test "$HOST_BUILDX_GO_SHA256" = 675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685
          test "$HOST_BUILDX_GO_ARCHIVE_VERSION" = v0.3.0
          test "$HOST_BUILDX_X_MOD_VERSION" = v0.40.0
          test "$HOST_BUILDX_BINARY_SHA256" = 6bd2cb8809abf99fd2a0acaf50a51b85e9a4b254cc9bfede6305e85f42c59eb2
          test "$HOST_BUILDKIT_VERSION" = v0.32.2
          test "$HOST_BUILDKIT_IMAGE" = "$DAPPER_BUILDKIT_IMAGE"
          test "$HOST_BUILDX_INSTALL_METHOD" = repository-locked-offline-source-builder
          test "$HOST_BUILDX_INSTALLER_PATH" = scripts/install-locked-host-buildx
          test "$HOST_BUILDX_PLUGIN_RELATIVE_PATH" = cli-plugins/docker-buildx
          cp toolchain/host-build-toolchain.lock evidence/host-build-toolchain.lock
          test "$DAPPER_BUILDX_COMMAND" = \
            "${ECR_SYNC_BUILDX_INSTALL_ROOT}/bin/docker-buildx"
          test "$DOCKER_CONFIG" = "$ECR_SYNC_DOCKER_CONFIG_ROOT"
          host_buildx_sha="$(sha256sum -- "$DAPPER_BUILDX_COMMAND")"
          host_buildx_sha="${host_buildx_sha%% *}"
          test "$host_buildx_sha" = "$HOST_BUILDX_BINARY_SHA256"
          test "$(sha256sum -- "$DOCKER_CONFIG/$HOST_BUILDX_PLUGIN_RELATIVE_PATH" | cut -d ' ' -f 1)" = \
            "$HOST_BUILDX_BINARY_SHA256"
          printf '%s\n' "$host_buildx_sha" > evidence/host-buildx-binary.sha256
          cp "${ECR_SYNC_BUILDX_INSTALL_ROOT}/buildx-go-version.txt" \
            evidence/host-buildx-go-version.txt
          cp "${ECR_SYNC_BUILDX_INSTALL_ROOT}/buildx-build.tsv" \
            evidence/host-buildx-build.tsv
          bash scripts/check-buildx-module-versions \
            evidence/host-buildx-go-version.txt \
            "go${HOST_BUILDX_GO_VERSION}" \
            "$HOST_BUILDX_GO_ARCHIVE_VERSION" \
            "$HOST_BUILDX_X_MOD_VERSION"
          docker buildx version | tee evidence/host-buildx-version.txt
          read -r buildx_module buildx_version buildx_commit \
            < evidence/host-buildx-version.txt
          test "$buildx_module" = github.com/docker/buildx
          test "$buildx_version" = v0.36.1
          test "$buildx_commit" = 1d8dde89b8aba914e05e45366770736fea1fd690
          printf '%s\n' "$DAPPER_BUILDKIT_IMAGE" > evidence/host-buildkit-image.txt
          docker version > evidence/runner-docker-version.txt
          bash ./scripts/check-source-gates | tee evidence/build-policy.txt

      - name: Build, test, validate, package, and prove reproducibility
        shell: bash
        run: |
          set -euo pipefail
          source toolchain/host-build-toolchain.lock
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          expected_dapper_created="$(date -u --date="@${source_date_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"
          first_dapper_builder="ecr-dapper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-first"
          second_dapper_builder="ecr-dapper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-second"

          cleanup_dapper_builders() {
            local builder
            for builder in "$first_dapper_builder" "$second_dapper_builder"; do
              if [ -n "$builder" ]; then
                docker buildx rm --force "$builder" >/dev/null 2>&1 || :
              fi
            done
          }
          trap cleanup_dapper_builders EXIT

          create_dapper_builder() {
            local builder="$1"
            local prefix="$2"
            local builder_container="buildx_buildkit_${builder}0"

            docker buildx create \
              --driver docker-container \
              --driver-opt "image=$DAPPER_BUILDKIT_IMAGE" \
              --driver-opt network=host \
              --name "$builder" >/dev/null
            docker buildx inspect --bootstrap "$builder" \
              > "evidence/${prefix}-buildkit-builder.txt"
            bash scripts/parse-buildx-buildkit-version \
              "evidence/${prefix}-buildkit-builder.txt" \
              > "evidence/${prefix}-buildkit-version.txt"
            test "$(cat "evidence/${prefix}-buildkit-version.txt")" = "$HOST_BUILDKIT_VERSION"
            docker container inspect --format '{{.Config.Image}}' "$builder_container" \
              > "evidence/${prefix}-buildkit-image.txt"
            test "$(cat "evidence/${prefix}-buildkit-image.txt")" = "$DAPPER_BUILDKIT_IMAGE"
          }

          capture_dapper_state() {
            local prefix="$1"
            local metadata_file="$2"
            local iid_file="$3"
            local daemon_image_id
            local config_digest manifest manifest_digest daemon_id_mode

            daemon_image_id="$(docker image inspect --format '{{.Id}}' "$DAPPER_IMAGE")"
            bash scripts/resolve-dapper-image-identity \
              "$metadata_file" \
              "$iid_file" \
              "$daemon_image_id" \
              "evidence/${prefix}-manifest-digest.txt" \
              "evidence/${prefix}-config-digest.txt"
            printf '%s\n' "$daemon_image_id" > "evidence/${prefix}-image-id.txt"
            config_digest="$(cat "evidence/${prefix}-config-digest.txt")"
            manifest_digest="$(cat "evidence/${prefix}-manifest-digest.txt")"
            if [ "$daemon_image_id" = "$config_digest" ]; then
              daemon_id_mode=config-digest
            elif [ "$daemon_image_id" = "$manifest_digest" ]; then
              daemon_id_mode=manifest-digest
            else
              printf 'unrecognized Dapper daemon image ID: %s\n' "$daemon_image_id" >&2
              return 1
            fi
            printf '%s\n' "$daemon_id_mode" > "evidence/${prefix}-daemon-id-mode.txt"
            docker image inspect --format '{{.Created}}' "$DAPPER_IMAGE" \
              > "evidence/${prefix}-created.txt"
            test "$(cat "evidence/${prefix}-created.txt")" = "$expected_dapper_created"
            docker image inspect --format '{{json .RootFS.Layers}}' "$DAPPER_IMAGE" \
              | jq -ce '
                  if type == "array" and length > 0 and
                     all(.[]; test("^sha256:[0-9a-f]{64}$"))
                  then .
                  else error("invalid or empty Dapper RootFS DiffID list")
                  end
                ' > "evidence/${prefix}-rootfs-diffids.json"
            docker image inspect "$DAPPER_IMAGE" \
              > "evidence/${prefix}-image-inspect.json"
            docker run --rm \
              --entrypoint /usr/local/libexec/pasturestack/check-go-telemetry-state \
              "$DAPPER_IMAGE" \
              /tmp/go-config/go/telemetry "$source_date_epoch" /usr/local/go/bin/go \
              > "evidence/${prefix}-go-telemetry-readback.txt"
            docker run --rm --volume "$PWD:/source:ro" --entrypoint go "$DAPPER_IMAGE" \
              version -m /source/bin/ecr-credential-sync \
              > "evidence/${prefix}-binary-build-info.txt"
            for manifest in \
                ubuntu-apt.lock \
                dapper-ubuntu-packages.tsv \
                dapper-toolchain.tsv \
                docker-cli-build.tsv \
                docker-cli-go-version.txt \
                buildx-go-version.txt \
                go-telemetry-mode.txt \
                go-telemetry-state.tsv; do
              docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
                "/usr/share/pasturestack/manifests/${manifest}" \
                > "evidence/${prefix}-${manifest}"
            done
          }

          create_dapper_builder "$first_dapper_builder" dapper-first
          make ci \
            DAPPER_IMAGE="$DAPPER_IMAGE" \
            DAPPER_BUILDER="$first_dapper_builder" \
            DAPPER_METADATA_FILE="$PWD/evidence/dapper-first-build-metadata.json" \
            DAPPER_IID_FILE="$PWD/evidence/dapper-first-build.iid" \
            DAPPER_NO_CACHE=true \
            DAPPER_SOURCE_DATE_EPOCH="$source_date_epoch" \
            RUNTIME_IMAGE_BUILD_TOKEN="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-first" \
            VERSION_OVERRIDE="$VERSION_OVERRIDE"
          expected_owner="$(id -u):$(id -g)"
          test "$(stat -c '%u:%g' bin/ecr-credential-sync)" = "$expected_owner"
          test "$(stat -c '%u:%g' dist/images)" = "$expected_owner"
          runtime_image="$(head -n 1 dist/images)"
          first_image_id="$(docker image inspect --format '{{.Id}}' "$runtime_image")"
          printf '%s\n' "$runtime_image" > evidence/runtime-image.txt
          printf '%s\n' "$first_image_id" > evidence/runtime-image-first-id.txt
          cp dist/runtime-image-build.json evidence/runtime-image-first-build.json
          test "$(jq -r '.imageId' evidence/runtime-image-first-build.json)" = "$first_image_id"
          sha256sum bin/ecr-credential-sync > evidence/ecr-credential-sync-first.sha256
          capture_dapper_state dapper-first \
            evidence/dapper-first-build-metadata.json \
            evidence/dapper-first-build.iid

          docker image rm "$runtime_image" "$DAPPER_IMAGE" >/dev/null
          rm -rf bin dist
          docker buildx rm --force "$first_dapper_builder" >/dev/null
          first_dapper_builder=

          create_dapper_builder "$second_dapper_builder" dapper-second
          make ci \
            DAPPER_IMAGE="$DAPPER_IMAGE" \
            DAPPER_BUILDER="$second_dapper_builder" \
            DAPPER_METADATA_FILE="$PWD/evidence/dapper-second-build-metadata.json" \
            DAPPER_IID_FILE="$PWD/evidence/dapper-second-build.iid" \
            DAPPER_NO_CACHE=true \
            DAPPER_SOURCE_DATE_EPOCH="$source_date_epoch" \
            RUNTIME_IMAGE_BUILD_TOKEN="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-second" \
            VERSION_OVERRIDE="$VERSION_OVERRIDE"
          test "$(head -n 1 dist/images)" = "$runtime_image"
          second_image_id="$(docker image inspect --format '{{.Id}}' "$runtime_image")"
          printf '%s\n' "$second_image_id" > evidence/runtime-image-second-id.txt
          cp dist/runtime-image-build.json evidence/runtime-image-second-build.json
          test "$(jq -r '.imageId' evidence/runtime-image-second-build.json)" = "$second_image_id"
          test "$first_image_id" = "$second_image_id"
          for result in \
              evidence/runtime-image-first-build.json \
              evidence/runtime-image-second-build.json; do
            jq -e '
              .schemaVersion == 1 and
              .kind == "runtime-image-export-load" and
              .status == "pass" and
              .exporter == "docker-archive" and
              .rewriteTimestamp == true and
              .compatibilityVersion == "20" and
              .buildxVersion == "v0.36.1" and
              .buildxCommit == "1d8dde89b8aba914e05e45366770736fea1fd690" and
              .buildkitVersion == "v0.32.2" and
              .buildkitImage == "moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8" and
              .buildxNativeExit == 0 and
              .loadNativeExit == 0 and
              ((.daemonImageIdMode == "config-digest" and .imageId == .configDigest) or
               (.daemonImageIdMode == "manifest-digest" and .imageId == .manifestDigest)) and
              .cleanup.scope == "exact-run-owned" and
              .cleanup.builderNativeExit == 0 and
              .cleanup.builderContainerAbsent == true and
              .cleanup.builderVolumeAbsent == true and
              .cleanup.archiveAbsent == true
            ' "$result" >/dev/null
          done
          for field in archiveSha256 imageId manifestDigest configDigest daemonImageIdMode; do
            test "$(jq -r --arg field "$field" '.[$field]' evidence/runtime-image-first-build.json)" = \
              "$(jq -r --arg field "$field" '.[$field]' evidence/runtime-image-second-build.json)"
          done
          sha256sum bin/ecr-credential-sync > evidence/ecr-credential-sync-second.sha256
          capture_dapper_state dapper-second \
            evidence/dapper-second-build-metadata.json \
            evidence/dapper-second-build.iid
          diff -u \
            evidence/ecr-credential-sync-first.sha256 \
            evidence/ecr-credential-sync-second.sha256
          for artifact in \
              image-id.txt \
              daemon-id-mode.txt \
              buildkit-image.txt \
              buildkit-version.txt \
              manifest-digest.txt \
              config-digest.txt \
              created.txt \
              rootfs-diffids.json \
              binary-build-info.txt \
              ubuntu-apt.lock \
              dapper-ubuntu-packages.tsv \
              dapper-toolchain.tsv \
              docker-cli-build.tsv \
              docker-cli-go-version.txt \
              buildx-go-version.txt \
              go-telemetry-readback.txt \
              go-telemetry-mode.txt \
              go-telemetry-state.tsv; do
            diff -u \
              "evidence/dapper-first-${artifact}" \
              "evidence/dapper-second-${artifact}"
          done
          docker buildx rm --force "$second_dapper_builder" >/dev/null
          second_dapper_builder=
          trap - EXIT
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'RUNTIME_IMAGE=%s\n' "$runtime_image" >> "$GITHUB_ENV"

      - name: Verify resolved package and toolchain manifests
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(. ./ubuntu-apt.lock; printf '%s' "$UBUNTU_APT_LOCKED_SNAPSHOT")"

          verify_dpkg_manifest() {
            local image="$1"
            local prefix="$2"
            local manifest_path="$3"

            docker inspect "$image" > "evidence/${prefix}-image-inspect.json"
            docker run --rm --entrypoint cat "$image" \
              /usr/share/pasturestack/manifests/ubuntu-apt.lock \
              > "evidence/${prefix}-ubuntu-apt.lock"
            diff -u ubuntu-apt.lock "evidence/${prefix}-ubuntu-apt.lock"
            docker run --rm --entrypoint cat "$image" "$manifest_path" \
              > "evidence/${prefix}-dpkg.tsv"
            {
              printf 'record\tname\tarchitecture\tversion\n'
              printf 'metadata\tschema\t-\tpasturestack.dpkg-manifest/v1\n'
              printf 'metadata\tubuntu_snapshot\t-\t%s\n' "$snapshot"
              docker run --rm --entrypoint dpkg-query "$image" \
                -W "-f=package\t\${binary:Package}\t\${Architecture}\t\${Version}\n" \
                | LC_ALL=C sort
            } > "evidence/${prefix}-dpkg-live.tsv"
            diff -u "evidence/${prefix}-dpkg.tsv" "evidence/${prefix}-dpkg-live.tsv"
            test "$(grep -c '^package' "evidence/${prefix}-dpkg.tsv")" -gt 0
          }

          verify_dpkg_manifest \
            "$DAPPER_IMAGE" dapper \
            /usr/share/pasturestack/manifests/dapper-ubuntu-packages.tsv
          docker inspect "$RUNTIME_IMAGE" > evidence/runtime-image-inspect.json
          test "$(docker image inspect --format '{{.Config.User}}' "$RUNTIME_IMAGE")" = '10001:10001'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.base.name"}}' "$RUNTIME_IMAGE")" = scratch
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$RUNTIME_IMAGE")" = '["/usr/local/bin/ecr-credential-sync"]'
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$RUNTIME_IMAGE" \
            | grep -Fx 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt'

          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/dapper-toolchain.tsv \
            > evidence/dapper-toolchain.tsv
          awk -F '\t' '
            NR == 1 {
              if ($0 != "component\tdeclared_version\ttarget\tinstalled_sha256\tinstalled_version") {
                exit 1
              }
              next
            }
            $4 !~ /^[0-9a-f]+$/ || length($4) != 64 || $5 == "" { exit 1 }
            END { if (NR != 6) exit 1 }
          ' evidence/dapper-toolchain.tsv
          grep -F $'gcc\t4:15.2.0-5ubuntu1\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          grep -F $'go\t1.27.0\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          grep -F $'docker\t29.7.2\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          grep -F $'buildx\t0.36.1\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          grep -F $'jq\t1.8.1-4ubuntu2\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          telemetry_mode_date="$(date -u --date="@${source_date_epoch}" +'%Y-%m-%d')"
          telemetry_mode="off ${telemetry_mode_date}"
          printf '%s' "$telemetry_mode" > evidence/go-telemetry-mode.expected
          cmp -s \
            evidence/go-telemetry-mode.expected \
            evidence/dapper-second-go-telemetry-mode.txt
          telemetry_mode_sha256="$(sha256sum evidence/go-telemetry-mode.expected | cut -d ' ' -f 1)"
          {
            printf 'record\tname\tvalue\n'
            printf 'metadata\tschema\tpasturestack.go-telemetry-state/v1\n'
            printf 'state\tgo_version\t1.27.0\n'
            printf 'state\tdirectory\t/tmp/go-config/go/telemetry\n'
            printf 'state\tmode\toff\n'
            printf 'state\tmode_date\t%s\n' "$telemetry_mode_date"
            printf 'state\tmode_format\toff YYYY-MM-DD\n'
            printf 'state\tmode_sha256\t%s\n' "$telemetry_mode_sha256"
            printf 'state\tmetadata_epoch\t%s\n' "$source_date_epoch"
            printf 'state\tlocal\tabsent\n'
            printf 'state\tupload\tabsent\n'
            printf 'state\tdebug\tabsent\n'
            printf 'state\tcounter\tabsent\n'
            printf 'state\tweekends\tabsent\n'
            printf 'state\tcount_files\tabsent\n'
          } > evidence/go-telemetry-state.expected.tsv
          diff -u \
            evidence/go-telemetry-state.expected.tsv \
            evidence/dapper-second-go-telemetry-state.tsv
          test "$(cat evidence/dapper-second-go-telemetry-readback.txt)" = \
            "ECR_SYNC_GO_TELEMETRY_STATE_OK mode=off date=${telemetry_mode_date} dir=/tmp/go-config/go/telemetry metadata_epoch=${source_date_epoch} owner=0:0 directory_mode=755 mode_mode=644 mode_sha256=${telemetry_mode_sha256} counters=absent"
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/docker-cli-build.tsv \
            > evidence/docker-cli-build.tsv
          awk -F '\t' '
            NR == 1 {
              if ($0 != "component\tdeclared_version\tsource_uri\tsource_commit\tsource_sha256\tsource_date_epoch\tcompiler\ttarget\tinstalled_sha256\tinstalled_version\tbuild_flags") {
                exit 1
              }
              next
            }
            NR == 2 {
              if ($1 != "docker-cli" || $2 != "29.7.2" ||
                  $3 != "https://codeload.github.com/docker/cli/tar.gz/a7dcaa6fdb6ed04aacbfdc76357fdae01605609e" ||
                  $4 != "a7dcaa6fdb6ed04aacbfdc76357fdae01605609e" ||
                  $5 != "6e5c91d3a5a79db78cf989d07727d00e757aa0da4d135a3ce4b86061b83fb511" ||
                  $6 != "1785922455" || $7 != "go1.27.0" || $8 != "linux-amd64" ||
                  $9 !~ /^[0-9a-f]{64}$/ || $10 == "" ||
                  $11 != "-mod=mod -trimpath -buildvcs=false -tags=grpcnotrace,osusergo,netgo -ldflags=-s,-w,-buildid=") {
                exit 1
              }
            }
            END { if (NR != 2) exit 1 }
          ' evidence/docker-cli-build.tsv
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/docker-cli-go-version.txt \
            > evidence/docker-cli-go-version.txt
          test "$(awk 'NR == 1 { print $NF }' evidence/docker-cli-go-version.txt)" = 'go1.27.0'
          grep -F $'dep\tgolang.org/x/text\tv0.40.0\t' evidence/docker-cli-go-version.txt >/dev/null
          grep -F $'dep\tgoogle.golang.org/grpc\tv1.82.1\t' evidence/docker-cli-go-version.txt >/dev/null
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/buildx-go-version.txt \
            > evidence/buildx-go-version.txt
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/patches/buildx-security.patch \
            > evidence/buildx-security.patch
          diff -u toolchain/buildx-security.patch evidence/buildx-security.patch
          echo 'a29fdda204d592d0d46ed32b5fdc4336a7b3a7276301836d0a75b9386ca780f7  evidence/buildx-security.patch' | sha256sum -c -
          bash scripts/check-buildx-module-versions \
            evidence/buildx-go-version.txt go1.27.0 v0.3.0 v0.40.0
          docker run --rm --entrypoint go \
            --volume "$PWD:/work:ro" "$DAPPER_IMAGE" \
            version -m /work/bin/ecr-credential-sync \
            > evidence/ecr-credential-sync-go-version.txt
          docker run --rm \
            --volume "$PWD:/go/src/github.com/PastureStack/ecr-credential-sync:ro" \
            --entrypoint /bin/bash "$DAPPER_IMAGE" -lc \
            'set -euo pipefail; GOTOOLCHAIN=local GOPROXY=off GOSUMDB=sum.golang.org go list -mod=vendor -deps ./...' \
            | LC_ALL=C sort -u > evidence/source-go-dependencies.txt
          if grep -Eq '^github.com/aws/aws-sdk-go($|/)' \
            evidence/source-go-dependencies.txt; then
            echo 'The end-of-life AWS SDK for Go v1 is reachable.' >&2
            exit 1
          fi
          grep -Fqx 'github.com/aws/aws-sdk-go-v2/service/ecr' evidence/source-go-dependencies.txt
          grep -Fqx 'github.com/aws/aws-sdk-go-v2/credentials/stscreds' evidence/source-go-dependencies.txt

      - name: Generate SBOMs and Trivy reports
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          docker inspect "$TRIVY_IMAGE" > evidence/trivy-image-inspect.json
          docker run --rm "$TRIVY_IMAGE" --version > evidence/trivy-version.txt
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          source_tree="$(mktemp -d)"
          cleanup_scan() {
            rm -rf "$source_tree"
          }
          trap cleanup_scan EXIT
          test ! -e "$trivy_cache"
          test ! -L "$trivy_cache"
          mkdir -m 0700 -- "$trivy_cache"
          test -d "$trivy_cache"
          test ! -L "$trivy_cache"
          test -O "$trivy_cache"
          test "$(realpath -e -- "$trivy_cache")" = "$trivy_cache"
          test "$(stat -Lc '%u:%g:%a' -- "$trivy_cache")" = "$(id -u):$(id -g):700"
          trivy_cache_identity="$(stat -Lc '%d:%i:%u:%g:%a' -- "$trivy_cache")"
          {
            printf 'ECR_SYNC_TRIVY_CACHE_ROOT=%s\n' "$trivy_cache"
            printf 'ECR_SYNC_TRIVY_CACHE_ROOT_IDENTITY=%s\n' "$trivy_cache_identity"
          } >> "$GITHUB_ENV"
          git archive --format=tar HEAD | tar -xf - -C "$source_tree"

          docker run --rm \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --download-db-only
          (
            cd "$trivy_cache"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) > evidence/trivy-database.sha256
          trivy_metadata="${trivy_cache}/db/metadata.json"
          trivy_database="${trivy_cache}/db/trivy.db"
          for database_file in "$trivy_metadata" "$trivy_database"; do
            test -f "$database_file"
            test ! -L "$database_file"
            test -s "$database_file"
          done
          trivy_updated_at="$(jq -er '.UpdatedAt | strings | select(length > 0)' "$trivy_metadata")"
          {
            printf 'file\tbytes\tsha256\n'
            printf 'db/metadata.json\t%s\t%s\n' \
              "$(stat -Lc '%s' -- "$trivy_metadata")" \
              "$(sha256sum -- "$trivy_metadata" | awk '{print $1}')"
            printf 'db/trivy.db\t%s\t%s\n' \
              "$(stat -Lc '%s' -- "$trivy_database")" \
              "$(sha256sum -- "$trivy_database" | awk '{print $1}')"
          } > evidence/trivy-database-files.tsv
          printf '%s\n' "$trivy_updated_at" > evidence/trivy-database-updated-at.txt
          cp "$trivy_metadata" evidence/trivy-database-metadata.json

          docker run --rm \
            --volume "$source_tree:/scan:ro" \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs \
            --skip-db-update --offline-scan --scanners vuln,secret \
            --format json --output /evidence/source-security.json /scan
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --scanners vuln,secret \
            --format json --output /evidence/dapper-security.json \
            "$DAPPER_IMAGE"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --scanners vuln,secret \
            --format json --output /evidence/runtime-security.json \
            "$RUNTIME_IMAGE"

          python3 scripts/generate-source-sbom.py \
            --output evidence/source.cdx.json
          jq -e '
            [.metadata.properties[]?
              | select(.name == "pasturestack:dapper-jq-version")
              | select(.value == "1.8.1-4ubuntu2")
            ] | length == 1
          ' evidence/source.cdx.json >/dev/null
          jq -e '
            [.metadata.properties[]?
              | select(.name == "pasturestack:dapper-go-version")
              | select(.value == "1.27.0")
            ] | length == 1
          ' evidence/source.cdx.json >/dev/null
          jq -e '
            [.metadata.properties[]?
              | select(.name == "pasturestack:dapper-go-telemetry-mode")
              | select(.value == "off")
            ] | length == 1
          ' evidence/source.cdx.json >/dev/null
          jq -e '
            [.metadata.properties[]?
              | select(.name == "pasturestack:dapper-go-telemetry-directory")
              | select(.value == "/tmp/go-config/go/telemetry")
            ] | length == 1
          ' evidence/source.cdx.json >/dev/null
          jq -e '
            [.metadata.properties[]?
              | select(.name == "pasturestack:dapper-go-telemetry-mode-date-source")
              | select(.value == "SOURCE_DATE_EPOCH-UTC")
            ] | length == 1
          ' evidence/source.cdx.json >/dev/null
          jq -e '
            [.metadata.properties[]?
              | select(.name == "pasturestack:dapper-go-telemetry-mode-format")
              | select(.value == "off YYYY-MM-DD")
            ] | length == 1
          ' evidence/source.cdx.json >/dev/null
          jq -e '
            [.metadata.properties[]?
              | select(.name == "pasturestack:runtime-image-export")
              | select(.value == "docker-archive-rewrite-timestamp+explicit-image-load")
            ] | length == 1
          ' evidence/source.cdx.json >/dev/null
          jq -e '
            def exact_property($name; $value):
              [.metadata.properties[]?
                | select(.name == $name and .value == $value)
              ] | length == 1;
            exact_property("pasturestack:host-buildx-version"; "v0.36.1") and
            exact_property("pasturestack:host-buildx-commit"; "1d8dde89b8aba914e05e45366770736fea1fd690") and
            exact_property("pasturestack:host-buildx-source-sha256"; "fb28b5c2a198d05482f0656dfb7ee161240a904e36697bf7108e5d517f23854b") and
            exact_property("pasturestack:host-buildx-security-patch-sha256"; "a29fdda204d592d0d46ed32b5fdc4336a7b3a7276301836d0a75b9386ca780f7") and
            exact_property("pasturestack:host-buildx-go-version"; "1.27.0") and
            exact_property("pasturestack:host-buildx-go-sha256"; "675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685") and
            exact_property("pasturestack:host-buildx-go-archive-version"; "v0.3.0") and
            exact_property("pasturestack:host-buildx-x-mod-version"; "v0.40.0") and
            exact_property("pasturestack:host-buildx-binary-sha256"; "6bd2cb8809abf99fd2a0acaf50a51b85e9a4b254cc9bfede6305e85f42c59eb2") and
            exact_property("pasturestack:host-buildx-install-method"; "repository-locked-offline-source-builder")
          ' evidence/source.cdx.json >/dev/null
          docker run --rm \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" sbom \
            --skip-db-update --offline-scan \
            --format json --output /evidence/source-sbom-security.json \
            /evidence/source.cdx.json
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/dapper.cdx.json "$DAPPER_IMAGE"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/runtime.cdx.json "$RUNTIME_IMAGE"
          jq -e '
            [.components[]?
              | select(.name == "stdlib")
              | select((.version // "") | test("^(go|v)?1\\.26\\.6$"))
            ] | length >= 1
          ' evidence/dapper.cdx.json >/dev/null
          jq -e '
            [.components[]?
              | select(.name == "stdlib")
              | select((.version // "") | test("^(go|v)?1\\.26\\.5$"))
            ] | length == 0
          ' evidence/dapper.cdx.json >/dev/null
          jq -e '
            [.components[]?
              | select(.name == "jq")
              | select(.version == "1.8.1-4ubuntu2")
            ] | length == 1
          ' evidence/dapper.cdx.json >/dev/null
          jq -e '
            ([.components[]?
              | select(.purl == "pkg:golang/github.com/moby/go-archive@v0.3.0")
            ] | length) >= 1 and
            ([.components[]?
              | select(.purl == "pkg:golang/golang.org/x/mod@v0.40.0")
            ] | length) >= 1 and
            ([.components[]?
              | select(.purl == "pkg:golang/github.com/moby/go-archive@v0.2.1")
            ] | length) == 0 and
            ([.components[]?
              | select(.purl == "pkg:golang/golang.org/x/mod@v0.38.0")
            ] | length) == 0
          ' evidence/dapper.cdx.json >/dev/null
          canonical_runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          test "$trivy_cache" = "${canonical_runner_temp}/trivy-cache"
          test -d "$trivy_cache"
          test ! -L "$trivy_cache"
          test -O "$trivy_cache"
          test "$(realpath -e -- "$trivy_cache")" = "$trivy_cache"
          test "$(stat -Lc '%u:%g:%a' -- "$trivy_cache")" = \
            "$(id -u):$(id -g):700"
          test "$(stat -Lc '%d:%i:%u:%g:%a' -- "$trivy_cache")" = \
            "$trivy_cache_identity"
          trivy_cache_entries_output="$(
            sudo find -P "$trivy_cache" -xdev -mindepth 1 -maxdepth 2 \
              -printf '%y\t%P\n' |
              LC_ALL=C sort
          )"
          printf '%s\n' "$trivy_cache_entries_output" \
            > evidence/trivy-cache-entries.tsv
          mapfile -t trivy_cache_entries <<<"$trivy_cache_entries_output"
          expected_trivy_cache_entries=(
            $'d\tdb'
            $'d\tfanal'
            $'f\tdb/metadata.json'
            $'f\tdb/trivy.db'
            $'f\tfanal/fanal.db'
          )
          test "${#trivy_cache_entries[@]}" -eq "${#expected_trivy_cache_entries[@]}"
          for index in "${!expected_trivy_cache_entries[@]}"; do
            test "${trivy_cache_entries[$index]}" = "${expected_trivy_cache_entries[$index]}"
          done
          trivy_cache_ownership_output="$(
            sudo find -P "$trivy_cache" -xdev -mindepth 0 -maxdepth 2 \
              -printf '%y\t%P\t%U:%G\t%m\t%s\n' | LC_ALL=C sort
          )"
          printf '%s\n' "$trivy_cache_ownership_output" \
            > evidence/trivy-cache-ownership.tsv

      - name: Enforce source, builder, and runtime security policy
        shell: bash
        run: |
          set -euo pipefail
          : > evidence/security-summary.txt

          for scope in source runtime; do
            report="evidence/${scope}-security.json"
            secrets="$(jq '[.Results[]?.Secrets[]?] | length' "$report")"
            critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$report")"
            high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$report")"
            printf '%s_secrets=%s\n%s_critical=%s\n%s_high=%s\n' \
              "$scope" "$secrets" "$scope" "$critical" "$scope" "$high" \
              | tee -a evidence/security-summary.txt
            test "$secrets" -eq 0
            test "$critical" -eq 0
            test "$high" -eq 0
          done

          source_sbom_report=evidence/source-sbom-security.json
          source_sbom_findings="$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$source_sbom_report")"
          printf 'source_sbom_findings=%s\nsource_sbom_applicable=%s\n' \
            "$source_sbom_findings" "$source_sbom_findings" \
            | tee -a evidence/security-summary.txt
          test "$source_sbom_findings" -eq 0

          dapper_report=evidence/dapper-security.json
          dapper_secrets="$(jq '[.Results[]?.Secrets[]?] | length' "$dapper_report")"
          dapper_buildx_fixed_cve_regressions="$(jq '[
            .Results[]?
            | select(.Target == "usr/libexec/docker/cli-plugins/docker-buildx")
            | .Vulnerabilities[]?
            | select(
                (.VulnerabilityID == "CVE-2026-17106" and
                 .PkgName == "github.com/moby/go-archive" and
                 .InstalledVersion == "v0.2.1") or
                ((.VulnerabilityID == "CVE-2026-56864" or
                  .VulnerabilityID == "CVE-2026-56865") and
                 .PkgName == "golang.org/x/mod" and
                 .InstalledVersion == "v0.38.0")
              )
          ] | length' "$dapper_report")"
          dapper_unreviewed="$(jq '[
            .Results[]?.Vulnerabilities[]?
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")
            | select(.PkgName != "linux-libc-dev" or ((.FixedVersion // "") != ""))
          ] | length' "$dapper_report")"
          vex_expires='2026-09-15T00:00:00Z'
          test "$(date -u +%s)" -lt "$(date -u -d "$vex_expires" +%s)"
          jq -r '.Results[]?.Vulnerabilities[]?
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")
            | [.VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // ""), .Severity]
            | @tsv' "$dapper_report" | LC_ALL=C sort -u \
            > evidence/dapper-critical-high.tsv
          jq -n \
            --slurpfile report "$dapper_report" \
            --arg author 'PastureStack Security' \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg expires "$vex_expires" \
            --arg impact 'linux-libc-dev supplies user-space kernel API headers only in the disposable build and race-test image. The package is not copied into the product runtime image, so the vulnerable kernel implementation is not present.' \
            '{
              "@context":"https://openvex.dev/ns/v0.2.0",
              "@id":"https://github.com/PastureStack/ecr-credential-sync/security/openvex/dapper",
              author:$author,
              timestamp:$timestamp,
              "x-pasturestack-expires":$expires,
              version:1,
              statements:[
                $report[0].Results[]?.Vulnerabilities[]?
                | select((.Severity == "CRITICAL" or .Severity == "HIGH") and .PkgName == "linux-libc-dev" and ((.FixedVersion // "") == ""))
                | {
                    vulnerability:{name:.VulnerabilityID},
                    products:[{"@id":.PkgIdentifier.PURL}],
                    status:"not_affected",
                    justification:"vulnerable_code_not_present",
                    impact_statement:$impact
                  }
              ]
            }' > evidence/dapper.openvex.json
          dapper_reviewed="$(jq '.statements | length' evidence/dapper.openvex.json)"
          printf 'dapper_secrets=%s\ndapper_reviewed_unfixed_linux_libc_dev=%s\ndapper_unreviewed_critical_high=%s\ndapper_buildx_fixed_cve_regressions=%s\n' \
            "$dapper_secrets" "$dapper_reviewed" "$dapper_unreviewed" \
            "$dapper_buildx_fixed_cve_regressions" \
            | tee -a evidence/security-summary.txt
          test "$dapper_secrets" -eq 0
          test "$dapper_buildx_fixed_cve_regressions" -eq 0
          test "$dapper_unreviewed" -eq 0
          test "$dapper_reviewed" -eq "$(wc -l < evidence/dapper-critical-high.tsv)"
          jq -e --arg expires "$vex_expires" '
            .["x-pasturestack-expires"] == $expires and
            all(.statements[];
              .status == "not_affected" and
              .justification == "vulnerable_code_not_present" and
              (.products | length) == 1 and
              (.products[0]["@id"] | type == "string" and length > 0))
          ' evidence/dapper.openvex.json >/dev/null

          for sbom in evidence/source.cdx.json evidence/dapper.cdx.json evidence/runtime.cdx.json; do
            jq -e '.bomFormat == "CycloneDX"' "$sbom" >/dev/null
          done
          for sbom in evidence/source.cdx.json evidence/dapper.cdx.json evidence/runtime.cdx.json; do
            jq -e '([.components[]?] | length) > 0' "$sbom" >/dev/null
          done

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecr-credential-sync-supply-chain-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Clean runner resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          images=("$DAPPER_IMAGE" "$TRIVY_IMAGE")
          if [ -n "${RUNTIME_IMAGE:-}" ]; then
            images+=("$RUNTIME_IMAGE")
          fi
          for image in "${images[@]}"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm -f "$image" >/dev/null
            fi
          done

          cleanup_exact_home_root() {
            local root="$1"
            local expected_identity="$2"
            local expected_basename="$3"
            local canonical_home current_identity expected_root

            test -n "$root" || return 0
            test -n "$expected_identity"
            canonical_home="$(realpath -e -- "$HOME")"
            expected_root="${canonical_home}/${expected_basename}"
            test "$root" = "$expected_root"
            if [ ! -e "$root" ] && [ ! -L "$root" ]; then
              return 0
            fi
            test -d "$root"
            test ! -L "$root"
            test -O "$root"
            test "$(realpath -e -- "$root")" = "$root"
            test "$(stat -Lc '%a' -- "$root")" = 700
            current_identity="$(stat -Lc '%d:%i:%u:%g:%a' -- "$root")"
            test "$current_identity" = "$expected_identity"
            rm -rf -- "$root"
            test ! -e "$root"
            test ! -L "$root"
          }

          run_identity="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          bash scripts/cleanup-exact-trivy-cache \
            "${ECR_SYNC_TRIVY_CACHE_ROOT:-}" \
            "${ECR_SYNC_TRIVY_CACHE_ROOT_IDENTITY:-}"
          cleanup_exact_home_root \
            "${ECR_SYNC_BUILDX_INSTALL_ROOT:-}" \
            "${ECR_SYNC_BUILDX_INSTALL_ROOT_IDENTITY:-}" \
            ".pasturestack-ecr-buildx-install-${run_identity}"
          cleanup_exact_home_root \
            "${ECR_SYNC_DOCKER_CONFIG_ROOT:-}" \
            "${ECR_SYNC_DOCKER_CONFIG_ROOT_IDENTITY:-}" \
            ".pasturestack-ecr-docker-config-${run_identity}"
          rm -rf bin dist evidence
