name: PastureStack / Build, test, and supply-chain evidence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecr-credential-sync-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reproducible build, test, SBOM, and Trivy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DAPPER_IMAGE: local/ecr-credential-sync-dapper:${{ github.sha }}
      DAPPER_BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      VERSION_OVERRIDE: v3.1.0
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned host Buildx and BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
          use: false
          cache-binary: false

      - name: Record immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-revision.txt
          sha256sum \
            .dockerignore \
            README.md \
            SECURITY.md \
            ubuntu-apt.lock \
            Dockerfile.dapper \
            Makefile \
            package/Dockerfile \
            package/windows/amd64/Dockerfile \
            toolchain/buildx-security.patch \
            toolchain/host-build-toolchain.lock \
            scripts/build \
            scripts/build-runtime-image \
            scripts/ci \
            scripts/entry \
            scripts/install-locked-host-buildx \
            scripts/package \
            scripts/normalize-runtime-context-mtimes \
            scripts/resolve-dapper-image-identity \
            scripts/check-source-gates \
            scripts/generate-source-sbom.py \
            scripts/test \
            scripts/test-dapper-image-identity \
            scripts/test-install-locked-host-buildx \
            scripts/test-runtime-image-export-load \
            scripts/validate \
            security/openvex.json \
            .github/workflows/supply-chain.yml \
            > evidence/source-inputs.sha256
          source toolchain/host-build-toolchain.lock
          test "$HOST_BUILDX_VERSION" = v0.36.1
          test "$HOST_BUILDX_COMMIT" = 1d8dde89b8aba914e05e45366770736fea1fd690
          test "$HOST_BUILDKIT_VERSION" = v0.32.2
          test "$HOST_BUILDKIT_IMAGE" = "$DAPPER_BUILDKIT_IMAGE"
          test "$SETUP_BUILDX_ACTION_VERSION" = v4.2.0
          test "$SETUP_BUILDX_ACTION_COMMIT" = bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
          cp toolchain/host-build-toolchain.lock evidence/host-build-toolchain.lock
          docker buildx version | tee evidence/host-buildx-version.txt
          read -r buildx_module buildx_version buildx_commit \
            < evidence/host-buildx-version.txt
          test "$buildx_module" = github.com/docker/buildx
          test "$buildx_version" = v0.36.1
          test "$buildx_commit" = 1d8dde89b8aba914e05e45366770736fea1fd690
          printf '%s\n' "$DAPPER_BUILDKIT_IMAGE" > evidence/host-buildkit-image.txt
          docker version > evidence/runner-docker-version.txt
          bash ./scripts/check-source-gates | tee evidence/build-policy.txt

      - name: Build, test, validate, package, and prove reproducibility
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          expected_dapper_created="$(date -u --date="@${source_date_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"
          first_dapper_builder="ecr-dapper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-first"
          second_dapper_builder="ecr-dapper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-second"

          cleanup_dapper_builders() {
            local builder
            for builder in "$first_dapper_builder" "$second_dapper_builder"; do
              if [ -n "$builder" ]; then
                docker buildx rm --force "$builder" >/dev/null 2>&1 || :
              fi
            done
          }
          trap cleanup_dapper_builders EXIT

          create_dapper_builder() {
            local builder="$1"
            local prefix="$2"
            local builder_container="buildx_buildkit_${builder}0"

            docker buildx create \
              --driver docker-container \
              --driver-opt "image=$DAPPER_BUILDKIT_IMAGE" \
              --driver-opt network=host \
              --name "$builder" >/dev/null
            docker buildx inspect --bootstrap "$builder" \
              > "evidence/${prefix}-buildkit-builder.txt"
            awk '$1 == "BuildKit:" { print $2 }' \
              "evidence/${prefix}-buildkit-builder.txt" \
              > "evidence/${prefix}-buildkit-version.txt"
            test "$(cat "evidence/${prefix}-buildkit-version.txt")" = v0.32.2
            docker container inspect --format '{{.Config.Image}}' "$builder_container" \
              > "evidence/${prefix}-buildkit-image.txt"
            test "$(cat "evidence/${prefix}-buildkit-image.txt")" = "$DAPPER_BUILDKIT_IMAGE"
          }

          capture_dapper_state() {
            local prefix="$1"
            local metadata_file="$2"
            local iid_file="$3"
            local daemon_image_id
            local config_digest manifest manifest_digest daemon_id_mode

            daemon_image_id="$(docker image inspect --format '{{.Id}}' "$DAPPER_IMAGE")"
            bash scripts/resolve-dapper-image-identity \
              "$metadata_file" \
              "$iid_file" \
              "$daemon_image_id" \
              "evidence/${prefix}-manifest-digest.txt" \
              "evidence/${prefix}-config-digest.txt"
            printf '%s\n' "$daemon_image_id" > "evidence/${prefix}-image-id.txt"
            config_digest="$(cat "evidence/${prefix}-config-digest.txt")"
            manifest_digest="$(cat "evidence/${prefix}-manifest-digest.txt")"
            if [ "$daemon_image_id" = "$config_digest" ]; then
              daemon_id_mode=config-digest
            elif [ "$daemon_image_id" = "$manifest_digest" ]; then
              daemon_id_mode=manifest-digest
            else
              printf 'unrecognized Dapper daemon image ID: %s\n' "$daemon_image_id" >&2
              return 1
            fi
            printf '%s\n' "$daemon_id_mode" > "evidence/${prefix}-daemon-id-mode.txt"
            docker image inspect --format '{{.Created}}' "$DAPPER_IMAGE" \
              > "evidence/${prefix}-created.txt"
            test "$(cat "evidence/${prefix}-created.txt")" = "$expected_dapper_created"
            docker image inspect --format '{{json .RootFS.Layers}}' "$DAPPER_IMAGE" \
              | jq -ce '
                  if type == "array" and length > 0 and
                     all(.[]; test("^sha256:[0-9a-f]{64}$"))
                  then .
                  else error("invalid or empty Dapper RootFS DiffID list")
                  end
                ' > "evidence/${prefix}-rootfs-diffids.json"
            docker image inspect "$DAPPER_IMAGE" \
              > "evidence/${prefix}-image-inspect.json"
            docker run --rm --volume "$PWD:/source:ro" --entrypoint go "$DAPPER_IMAGE" \
              version -m /source/bin/ecr-credential-sync \
              > "evidence/${prefix}-binary-build-info.txt"
            for manifest in \
                ubuntu-apt.lock \
                dapper-ubuntu-packages.tsv \
                dapper-toolchain.tsv \
                docker-cli-build.tsv \
                docker-cli-go-version.txt \
                buildx-go-version.txt; do
              docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
                "/usr/share/pasturestack/manifests/${manifest}" \
                > "evidence/${prefix}-${manifest}"
            done
          }

          create_dapper_builder "$first_dapper_builder" dapper-first
          make ci \
            DAPPER_IMAGE="$DAPPER_IMAGE" \
            DAPPER_BUILDER="$first_dapper_builder" \
            DAPPER_METADATA_FILE="$PWD/evidence/dapper-first-build-metadata.json" \
            DAPPER_IID_FILE="$PWD/evidence/dapper-first-build.iid" \
            DAPPER_NO_CACHE=true \
            DAPPER_SOURCE_DATE_EPOCH="$source_date_epoch" \
            RUNTIME_IMAGE_BUILD_TOKEN="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-first" \
            VERSION_OVERRIDE="$VERSION_OVERRIDE"
          expected_owner="$(id -u):$(id -g)"
          test "$(stat -c '%u:%g' bin/ecr-credential-sync)" = "$expected_owner"
          test "$(stat -c '%u:%g' dist/images)" = "$expected_owner"
          runtime_image="$(head -n 1 dist/images)"
          first_image_id="$(docker image inspect --format '{{.Id}}' "$runtime_image")"
          printf '%s\n' "$runtime_image" > evidence/runtime-image.txt
          printf '%s\n' "$first_image_id" > evidence/runtime-image-first-id.txt
          cp dist/runtime-image-build.json evidence/runtime-image-first-build.json
          test "$(jq -r '.imageId' evidence/runtime-image-first-build.json)" = "$first_image_id"
          sha256sum bin/ecr-credential-sync > evidence/ecr-credential-sync-first.sha256
          capture_dapper_state dapper-first \
            evidence/dapper-first-build-metadata.json \
            evidence/dapper-first-build.iid

          docker image rm "$runtime_image" "$DAPPER_IMAGE" >/dev/null
          rm -rf bin dist
          docker buildx rm --force "$first_dapper_builder" >/dev/null
          first_dapper_builder=

          create_dapper_builder "$second_dapper_builder" dapper-second
          make ci \
            DAPPER_IMAGE="$DAPPER_IMAGE" \
            DAPPER_BUILDER="$second_dapper_builder" \
            DAPPER_METADATA_FILE="$PWD/evidence/dapper-second-build-metadata.json" \
            DAPPER_IID_FILE="$PWD/evidence/dapper-second-build.iid" \
            DAPPER_NO_CACHE=true \
            DAPPER_SOURCE_DATE_EPOCH="$source_date_epoch" \
            RUNTIME_IMAGE_BUILD_TOKEN="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-second" \
            VERSION_OVERRIDE="$VERSION_OVERRIDE"
          test "$(head -n 1 dist/images)" = "$runtime_image"
          second_image_id="$(docker image inspect --format '{{.Id}}' "$runtime_image")"
          printf '%s\n' "$second_image_id" > evidence/runtime-image-second-id.txt
          cp dist/runtime-image-build.json evidence/runtime-image-second-build.json
          test "$(jq -r '.imageId' evidence/runtime-image-second-build.json)" = "$second_image_id"
          test "$first_image_id" = "$second_image_id"
          for result in \
              evidence/runtime-image-first-build.json \
              evidence/runtime-image-second-build.json; do
            jq -e '
              .schemaVersion == 1 and
              .kind == "runtime-image-export-load" and
              .status == "pass" and
              .exporter == "docker-archive" and
              .rewriteTimestamp == true and
              .compatibilityVersion == "20" and
              .buildxVersion == "v0.36.1" and
              .buildxCommit == "1d8dde89b8aba914e05e45366770736fea1fd690" and
              .buildkitVersion == "v0.32.2" and
              .buildkitImage == "moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8" and
              .buildxNativeExit == 0 and
              .loadNativeExit == 0 and
              ((.daemonImageIdMode == "config-digest" and .imageId == .configDigest) or
               (.daemonImageIdMode == "manifest-digest" and .imageId == .manifestDigest)) and
              .cleanup.scope == "exact-run-owned" and
              .cleanup.builderNativeExit == 0 and
              .cleanup.builderContainerAbsent == true and
              .cleanup.builderVolumeAbsent == true and
              .cleanup.archiveAbsent == true
            ' "$result" >/dev/null
          done
          for field in archiveSha256 imageId manifestDigest configDigest daemonImageIdMode; do
            test "$(jq -r --arg field "$field" '.[$field]' evidence/runtime-image-first-build.json)" = \
              "$(jq -r --arg field "$field" '.[$field]' evidence/runtime-image-second-build.json)"
          done
          sha256sum bin/ecr-credential-sync > evidence/ecr-credential-sync-second.sha256
          capture_dapper_state dapper-second \
            evidence/dapper-second-build-metadata.json \
            evidence/dapper-second-build.iid
          diff -u \
            evidence/ecr-credential-sync-first.sha256 \
            evidence/ecr-credential-sync-second.sha256
          for artifact in \
              image-id.txt \
              daemon-id-mode.txt \
              buildkit-image.txt \
              buildkit-version.txt \
              manifest-digest.txt \
              config-digest.txt \
              created.txt \
              rootfs-diffids.json \
              binary-build-info.txt \
              ubuntu-apt.lock \
              dapper-ubuntu-packages.tsv \
              dapper-toolchain.tsv \
              docker-cli-build.tsv \
              docker-cli-go-version.txt \
              buildx-go-version.txt; do
            diff -u \
              "evidence/dapper-first-${artifact}" \
              "evidence/dapper-second-${artifact}"
          done
          docker buildx rm --force "$second_dapper_builder" >/dev/null
          second_dapper_builder=
          trap - EXIT
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'RUNTIME_IMAGE=%s\n' "$runtime_image" >> "$GITHUB_ENV"

      - name: Verify resolved package and toolchain manifests
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(. ./ubuntu-apt.lock; printf '%s' "$UBUNTU_APT_LOCKED_SNAPSHOT")"

          verify_runtime_manifest_access() {
            local image="$1"

            docker run --rm --entrypoint /bin/sh "$image" -ec '
              manifest_root=/usr/share/pasturestack/manifests
              test "$(id -u):$(id -g)" = "10001:10001"
              for manifest_parent in / /usr /usr/share /usr/share/pasturestack "$manifest_root"; do
                test -d "$manifest_parent"
                test -r "$manifest_parent"
                test -x "$manifest_parent"
                test "$(stat -c %u:%g "$manifest_parent")" = "0:0"
                test -z "$(find "$manifest_parent" -maxdepth 0 -perm /022 -print -quit)"
              done
              test -z "$(find /usr/share/pasturestack -type d -perm /022 -print -quit)"
              test -z "$(find "$manifest_root" -type f -perm /022 -print -quit)"
              test -z "$(find "$manifest_root" -type f ! -perm -0444 -print -quit)"
              test -z "$(find "$manifest_root" -type f ! -user root -print -quit)"
              test -z "$(find "$manifest_root" -type f ! -group root -print -quit)"
              for required_manifest in \
                  "$manifest_root/ubuntu-apt.lock" \
                  "$manifest_root/runtime-ubuntu-packages.tsv"; do
                test -f "$required_manifest"
                test -r "$required_manifest"
                cat "$required_manifest" >/dev/null
              done
            '
          }

          verify_dpkg_manifest() {
            local image="$1"
            local prefix="$2"
            local manifest_path="$3"

            docker inspect "$image" > "evidence/${prefix}-image-inspect.json"
            docker run --rm --entrypoint cat "$image" \
              /usr/share/pasturestack/manifests/ubuntu-apt.lock \
              > "evidence/${prefix}-ubuntu-apt.lock"
            diff -u ubuntu-apt.lock "evidence/${prefix}-ubuntu-apt.lock"
            docker run --rm --entrypoint cat "$image" "$manifest_path" \
              > "evidence/${prefix}-dpkg.tsv"
            {
              printf 'record\tname\tarchitecture\tversion\n'
              printf 'metadata\tschema\t-\tpasturestack.dpkg-manifest/v1\n'
              printf 'metadata\tubuntu_snapshot\t-\t%s\n' "$snapshot"
              if [ "$prefix" = runtime ]; then
                printf 'metadata\tbase_image\t-\t%s\n' \
                  'ubuntu:26.04@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03'
              fi
              docker run --rm --entrypoint dpkg-query "$image" \
                -W "-f=package\t\${binary:Package}\t\${Architecture}\t\${Version}\n" \
                | LC_ALL=C sort
            } > "evidence/${prefix}-dpkg-live.tsv"
            diff -u "evidence/${prefix}-dpkg.tsv" "evidence/${prefix}-dpkg-live.tsv"
            test "$(grep -c '^package' "evidence/${prefix}-dpkg.tsv")" -gt 0
          }

          verify_dpkg_manifest \
            "$DAPPER_IMAGE" dapper \
            /usr/share/pasturestack/manifests/dapper-ubuntu-packages.tsv
          verify_runtime_manifest_access "$RUNTIME_IMAGE"
          verify_dpkg_manifest \
            "$RUNTIME_IMAGE" runtime \
            /usr/share/pasturestack/manifests/runtime-ubuntu-packages.tsv

          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/dapper-toolchain.tsv \
            > evidence/dapper-toolchain.tsv
          awk -F '\t' '
            NR == 1 {
              if ($0 != "component\tdeclared_version\ttarget\tinstalled_sha256\tinstalled_version") {
                exit 1
              }
              next
            }
            $4 !~ /^[0-9a-f]+$/ || length($4) != 64 || $5 == "" { exit 1 }
            END { if (NR != 6) exit 1 }
          ' evidence/dapper-toolchain.tsv
          grep -F $'gcc\t4:15.2.0-5ubuntu1\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          grep -F $'go\t1.26.6\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          grep -F $'docker\t29.7.2\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          grep -F $'buildx\t0.36.1\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          grep -F $'jq\t1.8.1-4ubuntu2\tlinux-amd64\t' evidence/dapper-toolchain.tsv >/dev/null
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/docker-cli-build.tsv \
            > evidence/docker-cli-build.tsv
          awk -F '\t' '
            NR == 1 {
              if ($0 != "component\tdeclared_version\tsource_uri\tsource_commit\tsource_sha256\tsource_date_epoch\tcompiler\ttarget\tinstalled_sha256\tinstalled_version\tbuild_flags") {
                exit 1
              }
              next
            }
            NR == 2 {
              if ($1 != "docker-cli" || $2 != "29.7.2" ||
                  $3 != "https://codeload.github.com/docker/cli/tar.gz/a7dcaa6fdb6ed04aacbfdc76357fdae01605609e" ||
                  $4 != "a7dcaa6fdb6ed04aacbfdc76357fdae01605609e" ||
                  $5 != "6e5c91d3a5a79db78cf989d07727d00e757aa0da4d135a3ce4b86061b83fb511" ||
                  $6 != "1785922455" || $7 != "go1.26.6" || $8 != "linux-amd64" ||
                  $9 !~ /^[0-9a-f]{64}$/ || $10 == "" ||
                  $11 != "-mod=mod -trimpath -buildvcs=false -tags=grpcnotrace,osusergo,netgo -ldflags=-s,-w,-buildid=") {
                exit 1
              }
            }
            END { if (NR != 2) exit 1 }
          ' evidence/docker-cli-build.tsv
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/docker-cli-go-version.txt \
            > evidence/docker-cli-go-version.txt
          test "$(awk 'NR == 1 { print $NF }' evidence/docker-cli-go-version.txt)" = 'go1.26.6'
          grep -F $'dep\tgolang.org/x/text\tv0.40.0\t' evidence/docker-cli-go-version.txt >/dev/null
          grep -F $'dep\tgoogle.golang.org/grpc\tv1.82.1\t' evidence/docker-cli-go-version.txt >/dev/null
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/buildx-go-version.txt \
            > evidence/buildx-go-version.txt
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/patches/buildx-security.patch \
            > evidence/buildx-security.patch
          diff -u toolchain/buildx-security.patch evidence/buildx-security.patch
          echo '9d424e752f24ea0e34ccd80340428f067ae8109204c401c93786a2b0be6ea993  evidence/buildx-security.patch' | sha256sum -c -
          if grep -F $'dep\tgithub.com/docker/docker\t' evidence/buildx-go-version.txt; then
            echo 'patched Buildx binary still records github.com/docker/docker' >&2
            exit 1
          fi
          docker run --rm --entrypoint go \
            --volume "$PWD:/work:ro" "$DAPPER_IMAGE" \
            version -m /work/bin/ecr-credential-sync \
            > evidence/ecr-credential-sync-go-version.txt
          docker run --rm \
            --volume "$PWD:/go/src/github.com/PastureStack/ecr-credential-sync:ro" \
            --entrypoint /bin/bash "$DAPPER_IMAGE" -lc \
            'set -euo pipefail; GO111MODULE=off go list -deps ./...' \
            | LC_ALL=C sort -u > evidence/source-go-dependencies.txt
          if grep -Fqx 'github.com/aws/aws-sdk-go/service/s3/s3crypto' \
            evidence/source-go-dependencies.txt; then
            echo 'The vulnerable S3 encryption package is reachable.' >&2
            exit 1
          fi

      - name: Generate SBOMs and Trivy reports
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          docker inspect "$TRIVY_IMAGE" > evidence/trivy-image-inspect.json
          docker run --rm "$TRIVY_IMAGE" --version > evidence/trivy-version.txt
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          source_tree="$(mktemp -d)"
          cleanup_scan() {
            rm -rf "$source_tree"
          }
          trap cleanup_scan EXIT
          mkdir -p "$trivy_cache"
          git archive --format=tar HEAD | tar -xf - -C "$source_tree"

          docker run --rm \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --download-db-only
          (
            cd "$trivy_cache"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) > evidence/trivy-database.sha256

          docker run --rm \
            --volume "$source_tree:/scan:ro" \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs \
            --skip-db-update --offline-scan --scanners vuln,secret \
            --format json --output /evidence/source-security.json /scan
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --scanners vuln,secret \
            --format json --output /evidence/dapper-security.json \
            "$DAPPER_IMAGE"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --scanners vuln,secret \
            --format json --output /evidence/runtime-security.json \
            "$RUNTIME_IMAGE"

          python3 scripts/generate-source-sbom.py \
            --output evidence/source.cdx.json
          jq -e '
            [.metadata.properties[]?
              | select(.name == "pasturestack:dapper-jq-version")
              | select(.value == "1.8.1-4ubuntu2")
            ] | length == 1
          ' evidence/source.cdx.json >/dev/null
          jq -e '
            [.metadata.properties[]?
              | select(.name == "pasturestack:runtime-image-export")
              | select(.value == "docker-archive-rewrite-timestamp+explicit-image-load")
            ] | length == 1
          ' evidence/source.cdx.json >/dev/null
          cp security/openvex.json evidence/source.openvex.json
          docker run --rm \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" sbom \
            --skip-db-update --offline-scan \
            --format json --output /evidence/source-sbom-security.json \
            /evidence/source.cdx.json
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/dapper.cdx.json "$DAPPER_IMAGE"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/runtime.cdx.json "$RUNTIME_IMAGE"
          jq -e '
            [.components[]?
              | select(.name == "stdlib")
              | select((.version // "") | test("^(go|v)?1\\.26\\.6$"))
            ] | length >= 1
          ' evidence/dapper.cdx.json >/dev/null
          jq -e '
            [.components[]?
              | select(.name == "stdlib")
              | select((.version // "") | test("^(go|v)?1\\.26\\.5$"))
            ] | length == 0
          ' evidence/dapper.cdx.json >/dev/null
          jq -e '
            [.components[]?
              | select(.name == "jq")
              | select(.version == "1.8.1-4ubuntu2")
            ] | length == 1
          ' evidence/dapper.cdx.json >/dev/null

      - name: Enforce source, builder, and runtime security policy
        shell: bash
        run: |
          set -euo pipefail
          : > evidence/security-summary.txt

          for scope in source runtime; do
            report="evidence/${scope}-security.json"
            secrets="$(jq '[.Results[]?.Secrets[]?] | length' "$report")"
            critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$report")"
            high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$report")"
            printf '%s_secrets=%s\n%s_critical=%s\n%s_high=%s\n' \
              "$scope" "$secrets" "$scope" "$critical" "$scope" "$high" \
              | tee -a evidence/security-summary.txt
            test "$secrets" -eq 0
            test "$critical" -eq 0
            test "$high" -eq 0
          done

          source_sbom_report=evidence/source-sbom-security.json
          source_sbom_critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$source_sbom_report")"
          source_sbom_expected_fixed="$(jq '[
            .Results[]?.Vulnerabilities[]?
            | select(.VulnerabilityID == "CVE-2025-65637")
            | select(.PkgName == "github.com/sirupsen/logrus")
            | select(.InstalledVersion == "v0.10.0")
          ] | length' "$source_sbom_report")"
          source_sbom_expected_not_affected="$(jq '[
            .Results[]?.Vulnerabilities[]?
            | select(.VulnerabilityID == "CVE-2020-8911" or .VulnerabilityID == "CVE-2020-8912" or .VulnerabilityID == "CVE-2022-2582")
            | select(.PkgName == "github.com/aws/aws-sdk-go")
            | select(.InstalledVersion == "v1.8.0")
          ] | length' "$source_sbom_report")"
          source_sbom_unexpected="$(jq '[
            .Results[]?.Vulnerabilities[]?
            | select(
                (
                  .VulnerabilityID != "CVE-2025-65637"
                  or .PkgName != "github.com/sirupsen/logrus"
                  or .InstalledVersion != "v0.10.0"
                )
                and
                (
                  (.VulnerabilityID != "CVE-2020-8911" and .VulnerabilityID != "CVE-2020-8912" and .VulnerabilityID != "CVE-2022-2582")
                  or .PkgName != "github.com/aws/aws-sdk-go"
                  or .InstalledVersion != "v1.8.0"
                )
              )
          ] | length' "$source_sbom_report")"
          jq -e '.statements | length == 4' evidence/source.openvex.json >/dev/null
          jq -e '
            [.statements[]
              | select(.vulnerability.name == "CVE-2025-65637")
              | select(.status == "fixed")
              | select((.products | length) == 1)
              | select(.products[0]["@id"] == "pkg:golang/github.com/sirupsen/logrus@v0.10.0")
              | select(.status_notes | contains("6acd903758687c4a3db3c11701e6c414fcf1c1f7"))
              | select(.status_notes | contains("d40e25cd45ed9c6b2b66e6b97573a0413e4c23bd"))
            ] | length == 1
          ' evidence/source.openvex.json >/dev/null
          jq -e '
            [.statements[]
              | select(.vulnerability.name == "CVE-2020-8911" or .vulnerability.name == "CVE-2020-8912" or .vulnerability.name == "CVE-2022-2582")
              | select(.status == "not_affected")
              | select(.justification == "vulnerable_code_not_present")
              | select((.products | length) == 1)
              | select(.products[0]["@id"] == "pkg:golang/github.com/aws/aws-sdk-go@v1.8.0")
              | select(.impact_statement | contains("S3 encryption client package is neither vendored nor linked"))
              | .vulnerability.name
            ] | sort == ["CVE-2020-8911", "CVE-2020-8912", "CVE-2022-2582"]
          ' evidence/source.openvex.json >/dev/null
          printf 'source_sbom_raw_critical=%s\nsource_sbom_expected_fixed=%s\nsource_sbom_expected_not_affected=%s\nsource_sbom_unexpected=%s\nsource_sbom_applicable=0\n' \
            "$source_sbom_critical" "$source_sbom_expected_fixed" "$source_sbom_expected_not_affected" "$source_sbom_unexpected" \
            | tee -a evidence/security-summary.txt
          test "$source_sbom_critical" -eq 0
          test "$source_sbom_expected_fixed" -eq 1
          test "$source_sbom_expected_not_affected" -eq 3
          test "$source_sbom_unexpected" -eq 0

          dapper_report=evidence/dapper-security.json
          dapper_secrets="$(jq '[.Results[]?.Secrets[]?] | length' "$dapper_report")"
          dapper_unreviewed="$(jq '[
            .Results[]?.Vulnerabilities[]?
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")
            | select(.PkgName != "linux-libc-dev" or ((.FixedVersion // "") != ""))
          ] | length' "$dapper_report")"
          vex_expires='2026-09-15T00:00:00Z'
          test "$(date -u +%s)" -lt "$(date -u -d "$vex_expires" +%s)"
          jq -r '.Results[]?.Vulnerabilities[]?
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")
            | [.VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // ""), .Severity]
            | @tsv' "$dapper_report" | LC_ALL=C sort -u \
            > evidence/dapper-critical-high.tsv
          jq -n \
            --slurpfile report "$dapper_report" \
            --arg author 'PastureStack Security' \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg expires "$vex_expires" \
            --arg impact 'linux-libc-dev supplies user-space kernel API headers only in the disposable build and race-test image. The package is not copied into the product runtime image, so the vulnerable kernel implementation is not present.' \
            '{
              "@context":"https://openvex.dev/ns/v0.2.0",
              "@id":"https://github.com/PastureStack/ecr-credential-sync/security/openvex/dapper",
              author:$author,
              timestamp:$timestamp,
              "x-pasturestack-expires":$expires,
              version:1,
              statements:[
                $report[0].Results[]?.Vulnerabilities[]?
                | select((.Severity == "CRITICAL" or .Severity == "HIGH") and .PkgName == "linux-libc-dev" and ((.FixedVersion // "") == ""))
                | {
                    vulnerability:{name:.VulnerabilityID},
                    products:[{"@id":.PkgIdentifier.PURL}],
                    status:"not_affected",
                    justification:"vulnerable_code_not_present",
                    impact_statement:$impact
                  }
              ]
            }' > evidence/dapper.openvex.json
          dapper_reviewed="$(jq '.statements | length' evidence/dapper.openvex.json)"
          printf 'dapper_secrets=%s\ndapper_reviewed_unfixed_linux_libc_dev=%s\ndapper_unreviewed_critical_high=%s\n' \
            "$dapper_secrets" "$dapper_reviewed" "$dapper_unreviewed" \
            | tee -a evidence/security-summary.txt
          test "$dapper_secrets" -eq 0
          test "$dapper_unreviewed" -eq 0
          ! grep -Eq $'^package\tlinux-libc-dev([:]|\t)' evidence/runtime-dpkg.tsv
          test "$dapper_reviewed" -eq "$(wc -l < evidence/dapper-critical-high.tsv)"
          jq -e --arg expires "$vex_expires" '
            .["x-pasturestack-expires"] == $expires and
            all(.statements[];
              .status == "not_affected" and
              .justification == "vulnerable_code_not_present" and
              (.products | length) == 1 and
              (.products[0]["@id"] | type == "string" and length > 0))
          ' evidence/dapper.openvex.json >/dev/null

          for sbom in evidence/source.cdx.json evidence/dapper.cdx.json evidence/runtime.cdx.json; do
            jq -e '.bomFormat == "CycloneDX"' "$sbom" >/dev/null
          done
          for sbom in evidence/source.cdx.json evidence/dapper.cdx.json evidence/runtime.cdx.json; do
            jq -e '([.components[]?] | length) > 0' "$sbom" >/dev/null
          done

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecr-credential-sync-supply-chain-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Clean runner resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          images=("$DAPPER_IMAGE" "$TRIVY_IMAGE")
          if [ -n "${RUNTIME_IMAGE:-}" ]; then
            images+=("$RUNTIME_IMAGE")
          fi
          for image in "${images[@]}"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm -f "$image" >/dev/null
            fi
          done
          rm -rf bin dist evidence "$RUNNER_TEMP/trivy-cache"
